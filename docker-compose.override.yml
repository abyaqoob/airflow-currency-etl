services:
  scheduler:
    env_file:
      - .env
    networks:
      - airflow
      - currency_etl_network
    labels:
      docker.networking: "currency_etl_network"
      docker.persistent_storage: "mongodb_data,mongodb_config"

  api-server:
    env_file:
      - .env
    networks:
      - airflow
      - currency_etl_network
    labels:
      docker.networking: "currency_etl_network"
      docker.persistent_storage: "mongodb_data,mongodb_config"

  dag-processor:
    env_file:
      - .env
    networks:
      - airflow
      - currency_etl_network
    labels:
      docker.networking: "currency_etl_network"
      docker.persistent_storage: "mongodb_data,mongodb_config"

  triggerer:
    env_file:
      - .env
    networks:
      - airflow
      - currency_etl_network
    labels:
      docker.networking: "currency_etl_network"
      docker.persistent_storage: "mongodb_data,mongodb_config"

  postgres:
    networks:
      - airflow
      - currency_etl_network

  mongodb:
    image: mongo:7.0.14
    container_name: mongodb
    hostname: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-adminpassword}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - airflow
      - currency_etl_network
    labels:
      docker.networking: "currency_etl_network (bridge)"
      docker.persistent_storage: "mongodb_data:/data/db, mongodb_config:/data/configdb"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://localhost:27017/admin", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: mongo-express
    hostname: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-adminpassword}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: "27017"
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-adminpassword}@mongodb:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME:-expressadmin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD:-expresspassword}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - airflow
      - currency_etl_network
    labels:
      docker.networking: "currency_etl_network (bridge)"
      docker.persistent_storage: "stateless web UI backed by mongodb_data and mongodb_config"

networks:
  currency_etl_network:
    name: currency_etl_network
    driver: bridge
    labels:
      docker.networking.purpose: "Airflow to MongoDB and Mongo Express bridge network"

volumes:
  mongodb_data:
    name: mongodb_data
    labels:
      docker.persistent_storage.target: "/data/db"
  mongodb_config:
    name: mongodb_config
    labels:
      docker.persistent_storage.target: "/data/configdb"
